<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Convite para Jantar</title>
</head>
<body>
    <div class="envelope" onclick="abrirEnvelope()">
        <div class="flap"></div>
        <div class="card">
            <h1>Convite Especial</h1>
            <p> Amor, lembra daquele momento mágico que tivemos no BONTA, 
                com cada fatia da pizza parecendo feita especialmente para nós? 
                Que tal revivermos essa noite especial? 
               <p>Te espero lá: <b> 14/12 ás 19h</b></p> 
            </p>
            <p>
                <a href="https://youtu.be/GC5Ecs5iIrc?si=RRUpeUgJoNoN5AKg" target="_blank">Clique aqui para ouvir uma música romântica!</a>
            </p>
        </div>
    </div>

    <script>
        function abrirEnvelope() {
            const envelope = document.querySelector('.envelope');
            envelope.classList.toggle('aberto');
        }
    </script>
</body>
</html>
